services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 每日 pg_dump 到 ./backups，保留最近 7 份。只在备份容器里跑，不动 artex/postgres。
  db-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-artex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-artex}
      BACKUP_KEEP_DAYS: "7"
    volumes:
      - ./backups:/backups
      - ./scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup.sh"]
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:-ghcr.io/yzbenyu-wq/artex}:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # jwt.key 的存放目录（独立持久卷，见下方 volumes；不放 data/，避免出现在工作区文件管理器里）
      ARTEX_KEYS_DIR: /app/keys
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_HTTP_USER_AGENT: ${ARTEX_HTTP_USER_AGENT:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（SQLite 等）绑定到项目根目录的 data/，方便在宿主机直接查看/备份，
      # 容器重建也不丢。
      - ./data:/app/data
      # jwt.key 单独放 keys/：持久化登录会话，又不会出现在工作区文件管理器里。
      - ./keys:/app/keys
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
